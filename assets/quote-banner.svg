<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Elon Musk quote</title>
  <desc id="desc">Now is the time to take risks. Do something bold. You will not regret it.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.52" stop-color="#161b33"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#ff9e64"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="880" height="260" rx="24" fill="url(#background)"/>
  <rect x="2" y="2" width="896" height="276" rx="22" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="90" cy="40" r="72" fill="#7aa2f7" opacity=".12" filter="url(#glow)"/>
  <circle cx="820" cy="242" r="88" fill="#bb9af7" opacity=".13" filter="url(#glow)"/>

  <text x="52" y="82" fill="#7aa2f7" font-family="Georgia, serif" font-size="70" font-weight="680">&#8220;</text>
  <text x="450" y="86" fill="#c0caf5" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="620" text-anchor="middle">
    NOW IS THE TIME TO TAKE RISKS.
  </text>
  <text x="450" y="128" fill="#a9b1d6" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle">
    When you don&#8217;t yet have family obligations,
  </text>
  <text x="450" y="166" fill="#a9b1d6" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle">
    do something bold. You won&#8217;t regret it.
  </text>
  <rect x="330" y="194" width="240" height="3" rx="2" fill="url(#accent)"/>
  <text x="450" y="235" fill="#bb9af7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="580" text-anchor="middle">
    &#8212; ELON MUSK
  </text>
</svg>
